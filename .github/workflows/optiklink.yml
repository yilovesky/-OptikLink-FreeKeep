name: OptikLink 保活任务

on:
  workflow_dispatch:      # 允许手动点击运行
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动运行一次（可根据需要修改）

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 获取代码
        uses: actions/checkout@v4

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm install

      - name: 🎭 安装 Playwright 浏览器
        run: npx playwright install chromium --with-deps

      - name: 🚀 执行保活脚本
        env:
          # 这里关联你在 GitHub Settings -> Secrets 中设置的变量
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PANEL_ACCOUNT: ${{ secrets.PANEL_ACCOUNT }}
          TG_BOT: ${{ secrets.TG_BOT }}
          # 如果你有代理，取消下面这行的注释并填入
          # GOST_PROXY: ${{ secrets.GOST_PROXY }} 
        run: npx playwright test tests/optiklink.spec.js

      - name: 📸 上传失败截图 (如果报错)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
